name: Build

# 每次提交（任意分支）以及 PR 都自动构建服务端插件与客户端模组
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交会取消上一次仍在进行的构建，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: server-plugin
            directory: server-plugin
            task: ":server:build"
            artifact: MCJE_Tracker-server
            path: server-plugin/server/build/libs/*.jar
          - project: client-mod
            directory: client-mod
            task: "build"
            artifact: mcjetracker
            path: client-mod/build/libs/*.jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom 的陈旧缓存会导致构建失败，客户端构建前清理
      - name: Clean Loom caches
        if: matrix.project == 'client-mod'
        run: |
          rm -rf ~/.gradle/caches/fabric-loom
          rm -rf ~/.gradle/caches/modules-2/files-2.1/net.fabricmc
          rm -rf ~/.gradle/caches/build-cache-1

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error